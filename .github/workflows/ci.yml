name: FinTrack CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test Server & Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Backend Test Suite (runs completely offline with MongoDB Memory Server and Mocked LLMs)
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend Integration & Unit Tests
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: test_github_actions_ci_secret_key_1234567890
          JWT_EXPIRE: 7d

      # Frontend Production Build
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Compile Client Production Bundle
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: /api
