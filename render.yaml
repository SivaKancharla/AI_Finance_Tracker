services:
  - type: web
    name: fintrack-api
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: LLM_PROVIDER_ORDER
        value: groq,gemini
      - key: LLM_TIMEOUT_MS
        value: 15000
      - key: LLM_MAX_RPM
        value: 10
      - key: LLM_MAX_RETRIES
        value: 1
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

