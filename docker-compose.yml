version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7-jammy
    container_name: fintrack-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - fintrack-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fintrack-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000,http://localhost:5173
      - MONGODB_URI=mongodb://mongo:27017/fintrack
      - JWT_SECRET=fintrack_docker_production_jwt_secret_key_1234567890
      - JWT_EXPIRE=7d
      - LLM_PROVIDER_ORDER=groq,gemini
      - LLM_TIMEOUT_MS=15000
      - LLM_MAX_RPM=10
      - LLM_MAX_RETRIES=1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fintrack-net

  # 3. Frontend Web Client (React + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: fintrack-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - fintrack-net

volumes:
  mongo_data:
    driver: local

networks:
  fintrack-net:
    driver: bridge
